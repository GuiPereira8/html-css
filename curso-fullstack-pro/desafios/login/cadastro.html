<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Crie sua conta</title>
</head>
<body>
    <main>
        <div class="div-form">
            <h1>Nova conta</h1>
            <form>
                <input type="text" name="nome" id="inome" placeholder="Nome completo">
                <input type="email" name="nemail" id="iemail" placeholder="Digite seu email" required>
                <input type="password" name="senha" id="isenha" placeholder="Digite sua senha" required>
                <div>
                    <input type="checkbox" name="termos" id="itermos">
                    <label for="itermos">Concordo com os termos.</label>
                </div> 
                <input type="button" value="Acessar">
                <img src="assets/code.svg" alt="code-icon">
            </form>
            <p>Já possui uma conta? <a href="index.html">Faça login.</a></p>
        </div>
        <div class="div-img">
            <img src="assets/info.png" alt="linguagens da web">
            <h2>Leve sua carreira ao próximo nível.</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.
             Egestas fermentum nibh volutpat turpis orci pharetra euismod quam non.</p>
        </div>
    </main>
</body>
</html>
