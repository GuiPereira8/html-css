<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body>
    <h1>Formulários com HTML</h1>
    <form action="cadastro.js">

        <p>
            <label for="iemail">Seu E-mail:</label>
            <input type="email" name="nemail" id="iemail" placeholder="exemplo@gmail.com">
        </p>

        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" placeholder="Primeiro nome" required>
        </p>

        <p>
            <label for="isobren">Sobrenome:</label>
            <input type="text" name="sobren" id="isobren" placeholder="Sobrenome" required>
        </p>

        <!-- Tipo RADIO -->
        <p>
            <label><strong>Qual seu nível de programador atualmente?</strong></label> <br>
            <label>
                <input type="radio" name="nivel" id="inivel" value="iniciante" checked>Sou iniciante </label>

            <label>
                <input type="radio" name="nivel" id="inivel" value="medio">Comecei a pouco tempo
            </label>

            <label>
                <input type="radio" name="nivel" id="inivel" value="Avancado">Sou avançado
            </label>
        </p>

        <!-- Tipo Select para selecionar itens -->
        <p>
            <label for="iescolaridade">
                <strong>Sua escolaridade</strong>
            </label>
            <select name="escolaridade" id="iescolaridade" required>
                <option value="" selected disabled>Selecione</option>
                <option value="">Educação básica</option>
                <option value="">Ensino médio</option>
                <option value="">Ensino Superior</option>
                <option value="">Pós graduação</option>
            </select>
        </p>

        <p>
            <label for="">
                <strong>Selecione as tecnologias que você conhece:</strong>
            </label>
        </p>
        <p>
            <input type="checkbox" name="tecnologia01" id="tecnologia01" value="HTML">
            <label for="tecnologia01">HTML</label>
            
            <input type="checkbox" name="tecnologia02" id="tecnologia02" value="CSS">
            <label for="tecnologia02">CSS</label>

            <input type="checkbox" name="tecnologia03" id="tecnologia03" value="JavaScript">
            <label for="tecnologia03">JavaScript</label>

            <input type="checkbox" name="tecnologia04" id="tecnologia04" value="Java">
            <label for="tecnologia04">Java</label>

            <input type="checkbox" name="tecnologia05" id="tecnologia05" value="ReactJS">
            <label for="tecnologia05">React.JS</label>
        </p>

        <p> <!-- Tipo Date -->
            <label for="idata">Data de nascimento:</label>
            <input type="date" name="data" id="idata">
        </p>

        <p>
            <input type="submit" value="Cadastrar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>

</html>
