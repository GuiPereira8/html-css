<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML</title>
</head>
<body>
    <h1>Trabalhando com videos</h1>
    <video width="480" autoplay controls loop muted>
        <source src="natureza.mp4" type="video/mp4">
    </video>

    <h2>Tag de áudio</h2>
    <audio controls>
        <source src="Paradise.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
