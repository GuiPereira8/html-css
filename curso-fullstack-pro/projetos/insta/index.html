<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SujeitoGram - Sua rede social</title>
</head>
<body>
    <div class="wrapper">

        <div id="container">
            <div class="column left">
                <div class="main"></div>
            </div>

            <div class="column right">
                <div class="login-panel">
                    <div class="logo">
                        <img src="assets/logo.png" alt="logo do SujeitoGram" class="logo-img">
                    </div>
                    
                    <form>
                        <input type="text" name="username" id="iusername" placeholder="Telefone, usuário ou email">
                        <input type="password" name="password" id="ipassword" placeholder="Senha">
                        <input type="submit" value="Entrar">
                    </form>
                </div>

                <div class="infobox">
                    <p>Não possui uma conta? <a href="#">Cadastre-se</a></p>
                </div>

                <div class="get-app">
                    <p>Obtenha o aplicativo</p>
                    <div class="app-buttons">
                        <a href="#">
                            <img src="assets/appstore.png" alt="Baixe na AppStore">
                        </a>
                        <a href="#">
                            <img src="assets/googleplay.png" alt="Baixe na GooglePlay">
                        </a>
                    </div>
                </div>

            </div>
            <!-- FIM DA AREA DIREITA -->
        </div>
        <!-- FIM DO CONTAINER -->

        <!-- RODAPÉ -->
         <footer>
            <div class="footer-inner">
                <a href="#">About us</a>
                <a href="#">Support</a>
                <a href="#">Blog</a>
                <a href="#">Press</a>
                <a href="#">Api</a>
                <a href="#">Jobs</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Directory</a>
                <a href="#">Profiles</a>
                <a href="#">Hashtags</a>
                <a href="#">Language</a>
                <p class="text-small">&copy; 2022 SujeitoGram</p>
            </div>
         </footer>
    </div>
</body>
</html>
