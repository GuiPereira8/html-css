<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Faça seu cadastro - SujeitoGram</title>
</head>
<body>
    <div class="wrapper">

        <div id="container-signup">

            <div class="column">
                <div class="login-panel">
                    <div class="logo">
                        <img src="assets/logo.png" alt="logo do SujeitoGram" class="logo-img">
                    </div>
                    <div class="message">
                        <span>Cadastre-se para ver fotos e vídeos dos seus amigos.</span>
                    </div>
                    <button type="button" class="face-button">Entrar com o Facebook</button>

                    <div class="divisor-container">
                        <div class="line"></div>
                        <div class="divisor-tag">ou</div>
                        <div class="line"></div>
                    </div>
                    
                    <form>
                        <input type="text" name="email" id="iemail" placeholder="Número de celular ou email">
                        <input type="text" name="name" id="iname" placeholder="Nome completo">
                        <input type="text" name="username" id="iusername" placeholder="Username">
                        <input type="password" name="password" id="ipassword" placeholder="Senha">
                        <input type="submit" value="Entrar">
                    </form>
                </div>

                <div class="infobox">
                    <p>Tem uma conta? <a href="index.html">Conecte-se</a></p>
                </div>

                <div class="get-app">
                    <p>Obtenha o aplicativo</p>
                    <div class="app-buttons">
                        <a href="#">
                            <img src="assets/appstore.png" alt="Baixe na AppStore">
                        </a>
                        <a href="#">
                            <img src="assets/googleplay.png" alt="Baixe na GooglePlay">
                        </a>
                    </div>
                </div>

            </div>
            <!-- FIM DA AREA DIREITA -->
        </div>
        <!-- FIM DO CONTAINER -->

        <!-- RODAPÉ -->
         <footer>
            <div class="footer-inner">
                <a href="#">About us</a>
                <a href="#">Support</a>
                <a href="#">Blog</a>
                <a href="#">Press</a>
                <a href="#">Api</a>
                <a href="#">Jobs</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Directory</a>
                <a href="#">Profiles</a>
                <a href="#">Hashtags</a>
                <a href="#">Language</a>
                <p class="text-small">&copy; 2022 SujeitoGram</p>
            </div>
         </footer>
    </div>
</body>
</html>
